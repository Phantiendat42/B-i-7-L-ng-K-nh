<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quang Trình Lăng Kính - Game Vật Lí 11</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #070b19;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Hiệu ứng nền không gian tối */
        .bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1e1b4b 0%, #070b19 70%);
            z-index: -2;
        }

        /* KHUNG 7 TIA SÁNG CHIẾU TỪ GÓC TRÊN BÊN TRÁI */
        .light-beams-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .beam {
            position: absolute;
            top: -50px;
            left: -50px;
            width: 3px;
            height: 150vh;
            transform: rotate(35deg);
            transform-origin: top left;
            opacity: 0.35; /* Độ mờ nhẹ nhàng */
            filter: blur(2px);
        }

        /* 7 màu quang phổ: Đỏ, Cam, Vàng, Lục, Lam, Chàm, Tím */
        .beam:nth-child(1) { background: #ef4444; left: 2%;  animation: pulseBeam 4s infinite alternate; }
        .beam:nth-child(2) { background: #f97316; left: 5%;  animation: pulseBeam 4.5s infinite alternate 0.5s; }
        .beam:nth-child(3) { background: #eab308; left: 8%;  animation: pulseBeam 5s infinite alternate 1s; }
        .beam:nth-child(4) { background: #22c55e; left: 11%; animation: pulseBeam 4.2s infinite alternate 1.5s; }
        .beam:nth-child(5) { background: #3b82f6; left: 14%; animation: pulseBeam 4.8s infinite alternate 2s; }
        .beam:nth-child(6) { background: #6366f1; left: 17%; animation: pulseBeam 5.2s infinite alternate 2.5s; }
        .beam:nth-child(7) { background: #a855f7; left: 20%; animation: pulseBeam 4.6s infinite alternate 3s; }

        @keyframes pulseBeam {
            0% { opacity: 0.2; transform: rotate(35deg) scaleX(0.8); }
            100% { opacity: 0.5; transform: rotate(35deg) scaleX(1.2); }
        }

        .game-container {
            background-color: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 650px;
            text-align: center;
            border: 2px solid rgba(59, 130, 246, 0.5);
            position: relative;
            z-index: 1;
        }

        /* SẢNH CHỜ (LOBBY) */
        #lobby-screen {
            display: block;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 28px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .subtitle {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .start-btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4);
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.6);
        }

        /* MÀN HÌNH CHƠI GAME (QUIZ) */
        #quiz-screen {
            display: none;
        }

        #progress {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #question-text {
            font-size: 18px;
            margin-bottom: 25px;
            font-weight: 600;
            line-height: 1.5;
            color: #f1f5f9;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #334155;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: #3b82f6;
            transform: translateX(4px);
        }

        .option-btn.correct {
            background-color: #22c55e !important;
            border-color: #4ade80 !important;
        }

        .option-btn.wrong {
            background-color: #ef4444 !important;
            border-color: #f87171 !important;
        }

        #next-btn {
            margin-top: 25px;
            background-color: #8b5cf6;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            display: none;
            transition: 0.2s;
        }

        #next-btn:hover {
            background-color: #7c3aed;
        }

        /* MÀN HÌNH KẾT QUẢ */
        #result-screen {
            display: none;
        }

        #result-screen h2 {
            color: #38bdf8;
            margin-bottom: 15px;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <!-- 7 VỆT ÁNH SÁNG DÀI CHIẾU TỪ GÓC TRÊN BÊN TRÁI -->
    <div class="light-beams-container">
        <div class="beam"></div>
        <div class="beam"></div>
        <div class="beam"></div>
        <div class="beam"></div>
        <div class="beam"></div>
        <div class="beam"></div>
        <div class="beam"></div>
    </div>

    <div class="game-container">
        
        <!-- SẢNH CHỜ (LOBBY) -->
        <div id="lobby-screen">
            <h1>Quang Trình Lăng Kính</h1>
            <p class="subtitle">Thử thách kiến thức Vật lí 11 về Khúc xạ & Tán sắc ánh sáng</p>
            <button class="start-btn" onclick="startGame()">Bắt đầu hành trình</button>
        </div>

        <!-- MÀN HÌNH CÂU HỎI -->
        <div id="quiz-screen">
            <div id="progress">Câu hỏi 1 / 10</div>
            <div id="question-text">Đang tải câu hỏi...</div>
            <div class="options-container" id="options-container"></div>
            <button id="next-btn" onclick="nextQuestion()">Câu tiếp theo ➔</button>
        </div>

        <!-- MÀN HÌNH KẾT QUẢ -->
        <div id="result-screen">
            <h2>🎉 Hoàn thành thử thách!</h2>
            <p id="score-text" style="font-size: 18px; margin: 20px 0; color: #cbd5e1;"></p>
            <button class="start-btn" onclick="restartGame()">Chơi lại từ đầu</button>
        </div>

    </div>

    <script>
        const questions = [
            {
                question: "Câu 1. Tiết diện thẳng của lăng kính có hình dạng là:",
                options: ["Hình tròn", "Hình vuông", "Hình tam giác", "Hình chữ nhật"],
                answer: 2
            },
            {
                question: "Câu 2. Qua lăng kính, tia ló luôn bị lệch về phía:",
                options: ["Cạnh lăng kính", "Đáy lăng kính", "Trục lăng kính", "Mặt bên lăng kính"],
                answer: 1
            },
            {
                question: "Câu 3. Ánh sáng đơn sắc là ánh sáng:",
                options: ["Bị tán sắc khi qua lăng kính", "Có một màu nhất định và không bị tán sắc", "Không bị lệch hướng khi qua lăng kính", "Chỉ truyền được trong không khí"],
                answer: 1
            },
            {
                question: "Câu 4. Hiện tượng lăng kính tách chùm sáng trắng thành nhiều chùm sáng màu gọi là:",
                options: ["Phản xạ", "Khúc xạ", "Tán sắc", "Gom sáng"],
                answer: 2
            },
            {
                question: "Câu 5. Dải màu quang phổ sau khi qua lăng kính biến thiên liên tục từ:",
                options: ["Đỏ đến Tím", "Lam đến Tím", "Vàng đến Lục", "Đỏ đến Lục"],
                answer: 0
            },
            {
                question: "Câu 6. Ánh sáng trắng (như ánh sáng Mặt Trời) là:",
                options: ["Ánh sáng đơn sắc", "Hỗn hợp nhiều ánh sáng đơn sắc từ đỏ đến tím", "Ánh sáng không bị khúc xạ", "Ánh sáng chỉ có màu trắng"],
                answer: 1
            },
            {
                question: "Câu 7. Vật có màu đỏ vì nó:",
                options: ["Hấp thụ ánh sáng màu đỏ", "Phản xạ ánh sáng màu đỏ đến mắt", "Tự phát ra ánh sáng màu đỏ", "Làm biến đổi ánh sáng trắng"],
                answer: 1
            },
            {
                question: "Câu 8. Ta nhìn thấy vật màu đen vì vật đó:",
                options: ["Phản xạ tất cả các màu", "Không phản xạ ánh sáng (hấp thụ hầu hết ánh sáng)", "Chỉ phản xạ ánh sáng tím", "Tự phát ra màu đen"],
                answer: 1
            },
            {
                question: "Câu 9. Thiết bị ứng dụng lăng kính để phân tích thành phần ánh sáng là:",
                options: ["Kính lúp", "Máy quang phổ", "Kính hiển vi", "Gương cầu"],
                answer: 1
            },
            {
                question: "Câu 10. Khi chùm sáng trắng qua lăng kính, tia lệch ít nhất là màu ... và lệch nhiều nhất là màu ...",
                options: ["Tím / Đỏ", "Đỏ / Lục", "Đỏ / Tím", "Vàng / Tím"],
                answer: 2
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const lobbyScreen = document.getElementById("lobby-screen");
        const quizScreen = document.getElementById("quiz-screen");
        const resultScreen = document.getElementById("result-screen");
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const progressText = document.getElementById("progress");
        const nextBtn = document.getElementById("next-btn");
        const scoreText = document.getElementById("score-text");

        function startGame() {
            lobbyScreen.style.display = "none";
            quizScreen.style.display = "block";
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            nextBtn.style.display = "none";
            const currentQ = questions[currentQuestionIndex];
            progressText.innerText = `Câu hỏi ${currentQuestionIndex + 1} / ${questions.length}`;
            questionText.innerText = currentQ.question;
            optionsContainer.innerHTML = "";

            currentQ.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.classList.add("option-btn");
                btn.innerText = `${String.fromCharCode(65 + index)}. ${option}`;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, selectedBtn) {
            if (answered) return;
            answered = true;

            const currentQ = questions[currentQuestionIndex];
            const allBtns = optionsContainer.children;

            if (selectedIndex === currentQ.answer) {
                selectedBtn.classList.add("correct");
                score++;
            } else {
                selectedBtn.classList.add("wrong");
                allBtns[currentQ.answer].classList.add("correct");
            }

            for (let btn of allBtns) {
                btn.disabled = true;
            }

            if (currentQuestionIndex < questions.length - 1) {
                nextBtn.style.display = "inline-block";
            } else {
                setTimeout(() => {
                    quizScreen.style.display = "none";
                    resultScreen.style.display = "block";
                    scoreText.innerText = `Bạn đã trả lời đúng ${score} / ${questions.length} câu hỏi!`;
                }, 1000);
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        function restartGame() {
            currentQuestionIndex = 0;
            score = 0;
            resultScreen.style.display = "none";
            lobbyScreen.style.display = "block";
        }
    </script>
</body>
</html>
