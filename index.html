<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 7 Lăng Kính - Game Vật Lí</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #070b19;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Hiệu ứng nền không gian tối */
        .bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1e1b4b 0%, #070b19 70%);
            z-index: -3;
        }

        /* KHUNG 7 TIA SÁNG CHỚP NHÁY LIÊN TỤC TỪ GÓC TRÊN BÊN TRÁI */
        .light-beams-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -2;
            pointer-events: none;
        }

        .beam {
            position: absolute;
            top: -50px;
            left: -50px;
            width: 4px;
            height: 160vh;
            transform: rotate(35deg);
            transform-origin: top left;
            filter: blur(2px);
        }

        /* 7 màu quang phổ với tốc độ chớp nháy và nhịp độ khác nhau */
        .beam:nth-child(1) { background: #ef4444; left: 1%;  animation: flashBeam 1.8s infinite alternate; }
        .beam:nth-child(2) { background: #f97316; left: 4%;  animation: flashBeam 1.2s infinite alternate 0.3s; }
        .beam:nth-child(3) { background: #eab308; left: 7%;  animation: flashBeam 2.1s infinite alternate 0.6s; }
        .beam:nth-child(4) { background: #22c55e; left: 10%; animation: flashBeam 1.5s infinite alternate 0.2s; }
        .beam:nth-child(5) { background: #3b82f6; left: 13%; animation: flashBeam 2.4s infinite alternate 0.9s; }
        .beam:nth-child(6) { background: #6366f1; left: 16%; animation: flashBeam 1.6s infinite alternate 0.4s; }
        .beam:nth-child(7) { background: #a855f7; left: 19%; animation: flashBeam 2.0s infinite alternate 0.7s; }

        @keyframes flashBeam {
            0% { opacity: 0.15; transform: rotate(35deg) scaleX(0.7); }
            50% { opacity: 0.6; transform: rotate(35deg) scaleX(1.4); filter: blur(3px); }
            100% { opacity: 0.25; transform: rotate(35deg) scaleX(0.9); }
        }

        /* CÁC HẠT SÁNG NỀN TRANG TRÍ */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: floatParticle 6s infinite linear;
            opacity: 0.3;
        }
        @keyframes floatParticle {
            0% { transform: translateY(105vh) scale(0); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-5vh) scale(1); opacity: 0; }
        }

        .game-container {
            background-color: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7), 0 0 25px rgba(59, 130, 246, 0.2);
            width: 100%;
            max-width: 650px;
            text-align: center;
            border: 2px solid rgba(59, 130, 246, 0.4);
            position: relative;
            z-index: 1;
        }

        /* TRANG TRÍ HÌNH LĂNG KÍNH 3D NHỎ Ở SẢNH CHỜ */
        .prism-decoration {
            width: 60px;
            height: 50px;
            margin: 0 auto 15px auto;
            position: relative;
            animation: rotatePrism 5s infinite ease-in-out;
        }
        .prism-shape {
            width: 0;
            height: 0;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-bottom: 50px solid rgba(56, 189, 248, 0.8);
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.8));
        }
        @keyframes rotatePrism {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-6px) scale(1.05); filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.9)); }
        }

        /* SẢNH CHỜ (LOBBY) */
        #lobby-screen {
            display: block;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 25px;
            font-size: 32px;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
            letter-spacing: 0.5px;
        }

        .start-btn {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4);
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.7);
        }

        /* MÀN HÌNH CHƠI GAME (QUIZ) */
        #quiz-screen {
            display: none;
            position: relative;
        }

        /* NÚT QUAY LẠI SẢNH */
        .home-btn {
            position: absolute;
            top: -15px;
            left: -5px;
            background: rgba(51, 65, 85, 0.8);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .home-btn:hover {
            background: #ef4444;
            color: white;
            border-color: #ef4444;
        }

        #progress {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 15px;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #question-text {
            font-size: 18px;
            margin-bottom: 25px;
            font-weight: 600;
            line-height: 1.5;
            color: #f1f5f9;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #334155;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            border-color: #3b82f6;
            transform: translateX(4px);
        }

        .option-btn.correct {
            background-color: #22c55e !important;
            border-color: #4ade80 !important;
        }

        .option-btn.wrong {
            background-color: #ef4444 !important;
            border-color: #f87171 !important;
        }

        #next-btn {
            margin-top: 25px;
            background-color: #8b5cf6;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            display: none;
            transition: 0.2s;
        }

        #next-btn:hover {
            background-color: #7c3aed;
        }

        /* MÀN HÌNH KẾT QUẢ */
        #result-screen {
            display: none;
        }

        #result-screen h2 {
            color: #38bdf8;
            margin-bottom: 15px;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <!-- 7 TIA SÁNG CHỚP NHÁY TỪ GÓC TRÊN BÊN TRÁI -->
    <div class="light-beams-container">
        <div class="beam"></div>
        <div class="beam"></div>
        <div class="beam"></div>
        <div class="beam"></div>
        <div class="beam"></div>
        <div class="beam"></div>
        <div class="beam"></div>
    </div>

    <!-- CÁC HẠT SÁNG NỀN -->
    <div class="particles" id="particles-container"></div>

    <div class="game-container">
        
        <!-- SẢNH CHỜ (LOBBY) -->
        <div id="lobby-screen">
            <div class="prism-decoration">
                <div class="prism-shape"></div>
            </div>
            <h1>Bài 7 Lăng Kính</h1>
            <button class="start-btn" onclick="startGame()">Bắt đầu chơi</button>
        </div>

        <!-- MÀN HÌNH CÂU HỎI -->
        <div id="quiz-screen">
            <button class="home-btn" onclick="goHome()">🏠 Sảnh</button>
            <div id="progress">Câu hỏi 1 / 10</div>
            <div id="question-text">Đang tải câu hỏi...</div>
            <div class="options-container" id="options-container"></div>
            <button id="next-btn" onclick="nextQuestion()">Câu tiếp theo ➔</button>
        </div>

        <!-- MÀN HÌNH KẾT QUẢ -->
        <div id="result-screen">
            <h2>🎉 Hoàn thành thử thách!</h2>
            <p id="score-text" style="font-size: 18px; margin: 20px 0; color: #cbd5e1;"></p>
            <button class="start-btn" onclick="restartGame()">Chơi lại từ đầu</button>
        </div>

    </div>

    <script>
        // Tạo các hạt sáng bay ngẫu nhiên nền
        const particlesContainer = document.getElementById("particles-container");
        for (let i = 0; i < 20; i++) {
            const p = document.createElement("div");
            p.classList.add("particle");
            p.style.left = Math.random() * 100 + "%";
            p.style.width = (Math.random() * 3 + 2) + "px";
            p.style.height = p.style.width;
            p.style.animationDuration = (Math.random() * 4 + 4) + "s";
            p.style.animationDelay = (Math.random() * 5) + "s";
            particlesContainer.appendChild(p);
        }

        const questions = [
            {
                question: "Câu 1. Tiết diện thẳng của lăng kính có hình dạng là:",
                options: ["Hình tròn", "Hình vuông", "Hình tam giác", "Hình chữ nhật"],
                answer: 2
            },
            {
                question: "Câu 2. Qua lăng kính, tia ló luôn bị lệch về phía:",
                options: ["Cạnh lăng kính", "Đáy lăng kính", "Trục lăng kính", "Mặt bên lăng kính"],
                answer: 1
            },
            {
                question: "Câu 3. Ánh sáng đơn sắc là ánh sáng:",
                options: ["Bị tán sắc khi qua lăng kính", "Có một màu nhất định và không bị tán sắc", "Không bị lệch hướng khi qua lăng kính", "Chỉ truyền được trong không khí"],
                answer: 1
            },
            {
                question: "Câu 4. Hiện tượng lăng kính tách chùm sáng trắng thành nhiều chùm sáng màu gọi là:",
                options: ["Phản xạ", "Khúc xạ", "Tán sắc", "Gom sáng"],
                answer: 2
            },
            {
                question: "Câu 5. Dải màu quang phổ sau khi qua lăng kính biến thiên liên tục từ:",
                options: ["Đỏ đến Tím", "Lam đến Tím", "Vàng đến Lục", "Đỏ đến Lục"],
                answer: 0
            },
            {
                question: "Câu 6. Ánh sáng trắng (như ánh sáng Mặt Trời) là:",
                options: ["Ánh sáng đơn sắc", "Hỗn hợp nhiều ánh sáng đơn sắc từ đỏ đến tím", "Ánh sáng không bị khúc xạ", "Ánh sáng chỉ có màu trắng"],
                answer: 1
            },
            {
                question: "Câu 7. Vật có màu đỏ vì nó:",
                options: ["Hấp thụ ánh sáng màu đỏ", "Phản xạ ánh sáng màu đỏ đến mắt", "Tự phát ra ánh sáng màu đỏ", "Làm biến đổi ánh sáng trắng"],
                answer: 1
            },
            {
                question: "Câu 8. Ta nhìn thấy vật màu đen vì vật đó:",
                options: ["Phản xạ tất cả các màu", "Không phản xạ ánh sáng (hấp thụ hầu hết ánh sáng)", "Chỉ phản xạ ánh sáng tím", "Tự phát ra màu đen"],
                answer: 1
            },
            {
                question: "Câu 9. Thiết bị ứng dụng lăng kính để phân tích thành phần ánh sáng là:",
                options: ["Kính lúp", "Máy quang phổ", "Kính hiển vi", "Gương cầu"],
                answer: 1
            },
            {
                question: "Câu 10. Khi chùm sáng trắng qua lăng kính, tia lệch ít nhất là màu ... và lệch nhiều nhất là màu ...",
                options: ["Tím / Đỏ", "Đỏ / Lục", "Đỏ / Tím", "Vàng / Tím"],
                answer: 2
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const lobbyScreen = document.getElementById("lobby-screen");
        const quizScreen = document.getElementById("quiz-screen");
        const resultScreen = document.getElementById("result-screen");
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const progressText = document.getElementById("progress");
        const nextBtn = document.getElementById("next-btn");
        const scoreText = document.getElementById("score-text");

        function startGame() {
            lobbyScreen.style.display = "none";
            quizScreen.style.display = "block";
            loadQuestion();
        }

        function goHome() {
            quizScreen.style.display = "none";
            resultScreen.style.display = "none";
            lobbyScreen.style.display = "block";
            currentQuestionIndex = 0;
            score = 0;
        }

        function loadQuestion() {
            answered = false;
            nextBtn.style.display = "none";
            const currentQ = questions[currentQuestionIndex];
            progressText.innerText = `Câu hỏi ${currentQuestionIndex + 1} / ${questions.length}`;
            questionText.innerText = currentQ.question;
            optionsContainer.innerHTML = "";

            currentQ.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.classList.add("option-btn");
                btn.innerText = `${String.fromCharCode(65 + index)}. ${option}`;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, selectedBtn) {
            if (answered) return;
            answered = true;

            const currentQ = questions[currentQuestionIndex];
            const allBtns = optionsContainer.children;

            if (selectedIndex === currentQ.answer) {
                selectedBtn.classList.add("correct");
                score++;
            } else {
                selectedBtn.classList.add("wrong");
                allBtns[currentQ.answer].classList.add("correct");
            }

            for (let btn of allBtns) {
                btn.disabled = true;
            }

            if (currentQuestionIndex < questions.length - 1) {
                nextBtn.style.display = "inline-block";
            } else {
                setTimeout(() => {
                    quizScreen.style.display = "none";
                    resultScreen.style.display = "block";
                    scoreText.innerText = `Bạn đã trả lời đúng ${score} / ${questions.length} câu hỏi!`;
                }, 1000);
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        function restartGame() {
            currentQuestionIndex = 0;
            score = 0;
            resultScreen.style.display = "none";
            lobbyScreen.style.display = "block";
        }
    </script>
</body>
</html>
